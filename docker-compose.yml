version: "3.9"

services:
  primary:
    image: postgres:16-alpine
    container_name: pg_primary
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpassword
      POSTGRES_DB: appdb
    ports:
      - "5433:5432"
    volumes:
      - primary_data:/var/lib/postgresql/data
    networks:
      - pgnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  replica:
    image: postgres:16-alpine
    container_name: pg_replica
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpassword
      POSTGRES_DB: appdb
    ports:
      - "5434:5432"
    volumes:
      - replica_data:/var/lib/postgresql/data
    networks:
      - pgnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  proxy:
    build: .
    container_name: pg_proxy
    environment:
      PRIMARY_DSN: "postgres://pguser:pgpassword@primary:5432/appdb?sslmode=disable"
      REPLICA_DSNS: "postgres://pguser:pgpassword@replica:5432/appdb?sslmode=disable"
      PROXY_LISTEN_ADDR: "0.0.0.0:5432"
      PROXY_ADMIN_ADDR: "0.0.0.0:8080"
      HEALTH_CHECK_INTERVAL: "10s"
      LOG_LEVEL: "info"
    ports:
      - "5432:5432"
      - "8080:8080"
    networks:
      - pgnet
    depends_on:
      primary:
        condition: service_healthy
      replica:
        condition: service_healthy

volumes:
  primary_data:
  replica_data:

networks:
  pgnet:
    driver: bridge
